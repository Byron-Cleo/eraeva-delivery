<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048"
     style="shape-rendering:geometricPrecision; text-rendering:geometricPrecision; image-rendering:optimizeQuality;">

  <!-- Background: deep dark warm brown/black -->
  <rect width="2048" height="2048" rx="256" ry="256" fill="#4A8F63"/>

  <!-- ═══════════════════════════════ PLATE ═══════════════════════════════ -->

  <!-- Outer decorative ring -->
  <circle cx="1024" cy="780" r="310" fill="none" stroke="#C8933A" stroke-width="20"/>
  <!-- Inner plate ring -->
  <circle cx="1024" cy="780" r="248" fill="none" stroke="#C8933A" stroke-width="10" opacity="0.7"/>
  <!-- Center ornament: small ring + dot -->
  <circle cx="1024" cy="780" r="38" fill="none" stroke="#C8933A" stroke-width="8" opacity="0.75"/>
  <circle cx="1024" cy="780" r="10" fill="#C8933A"/>

  <!-- Cardinal decorative dots on outer ring -->
  <circle cx="1024" cy="470" r="12" fill="#C8933A"/>  <!-- top    -->
  <circle cx="1334" cy="780" r="12" fill="#C8933A"/>  <!-- right  -->
  <circle cx="714"  cy="780" r="12" fill="#C8933A"/>  <!-- left   -->
  <circle cx="1024" cy="1090" r="12" fill="#C8933A"/> <!-- bottom -->

  <!-- ═══════════════════════════════ FORK ════════════════════════════════ -->
  <!-- 3 tines, fork center x≈594, spans y=420–1385 -->

  <!-- Tine 1 -->
  <rect x="541" y="420" width="26" height="215" rx="13" fill="#C8933A"/>
  <!-- Tine 2 -->
  <rect x="581" y="420" width="26" height="215" rx="13" fill="#C8933A"/>
  <!-- Tine 3 -->
  <rect x="621" y="420" width="26" height="215" rx="13" fill="#C8933A"/>

  <!-- Taper: tines converge into handle -->
  <path d="M541,625 L647,625 L619,705 L565,705 Z" fill="#C8933A"/>

  <!-- Handle -->
  <rect x="565" y="700" width="54" height="685" rx="27" fill="#C8933A"/>

  <!-- ═══════════════════════════════ KNIFE ════════════════════════════════ -->
  <!-- Knife center x≈1439, spans y=420–1385 -->

  <!-- Blade (curves outward from spine to edge, tapers to point at top) -->
  <path d="M1403,420 C1403,420 1476,498 1476,680 L1403,680 Z" fill="#C8933A"/>

  <!-- Blade spine reinforcement -->
  <rect x="1403" y="420" width="14" height="262" rx="7" fill="#C8933A"/>

  <!-- Bolster / guard -->
  <rect x="1399" y="676" width="80" height="32" rx="10" fill="#C8933A"/>

  <!-- Handle -->
  <rect x="1403" y="704" width="72" height="681" rx="36" fill="#C8933A"/>

  <!-- ═══════════════════════════════ TEXT ═════════════════════════════════ -->

  <!-- Top rule -->
  <line x1="500" y1="1460" x2="1548" y2="1460" stroke="#8B1A1A" stroke-width="6"/>

  <!-- Brand name -->
  <text x="1024" y="1598"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="178" font-weight="bold"
        text-anchor="middle"
        fill="#FFD700" letter-spacing="16">ERAEVA</text>

  <!-- Tagline -->
  <text x="1024" y="1692"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="76" font-weight="bold"
        text-anchor="middle"
        fill="#FFD700" letter-spacing="28">DELIVERY</text>

  <!-- Bottom rule -->
  <line x1="500" y1="1714" x2="1548" y2="1714" stroke="#8B1A1A" stroke-width="6"/>

</svg>
